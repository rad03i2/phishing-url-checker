name: Bug report
description: Report a reproducible analyzer, CLI or scoring problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use sanitized URLs only. Do not publish reset links, credentials, access tokens, customer URLs or private infrastructure.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "Output of: phishcheck --version"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - URL validation
        - Rule / scoring
        - CLI text output
        - JSON output
        - File input
        - Python API
        - Packaging / install
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction
      description: Use documentation-safe domains/IPs where possible.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
