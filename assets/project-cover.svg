<text x="90" y="742" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#EAF0F4">رضوان عبدالهادي · Radwan Abd alhady Ahmed</text>
<text x="1510" y="742" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#687785">A RADWAN ABD ALHADY PROJECT</text>
</svg>