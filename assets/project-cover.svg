<rect width="1600" height="800" rx="36" fill="url(#grid)" opacity=".7"/>
<circle cx="1420" cy="95" r="240" fill="#102130"/>
<circle cx="1480" cy="30" r="110" fill="#4DD5FF" opacity=".07" filter="url(#soft)"/>

<g transform="translate(86 76)">
