<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
<title id="title">Phishing URL Checker — Threat Lens</title>
<desc id="desc">Offline URL forensics identity showing a suspicious URL decomposed into explainable structural signals.</desc>
