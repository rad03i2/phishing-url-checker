</g>

<text x="88" y="285" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="8" fill="#4DD5FF">OFFLINE · EXPLAINABLE · STRUCTURAL URL ANALYSIS</text>
<text x="84" y="392" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="900" letter-spacing="-4" fill="#EAF0F4">Phishing URL</text>
<text x="84" y="486" font-family="Arial, Helvetica, sans-serif" font-size="94" font-weight="900" letter-spacing="-4" fill="#FFB547">Checker</text>
<text x="90" y="544" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#A9B6C2">Inspect the URL text. Explain the signals. Never visit the destination.</text>
<text x="90" y="592" direction="rtl" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#EAF0F4">تحليل محلي لبنية الرابط مع أسباب واضحة من دون فتح الموقع أو إرسال الرابط</text>

